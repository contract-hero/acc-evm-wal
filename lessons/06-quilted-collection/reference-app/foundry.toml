[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Forge-std-free + OpenZeppelin-free so the workspace runs offline. The
# `src/lib/` directory vendors minimal MiniERC721 + MiniOwnable + Strings
# substitutes — pre-provided to the learner. The lesson asks them to write
# only `src/QuiltedCollection.sol` on top of those.
